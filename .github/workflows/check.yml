name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also probe app.smpl.money and every page the listings link to"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit to check. Defaults to the caller's."
        required: false
        type: string

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: inputs.live == true
        run: npm run check:live
      - run: npm run build:openai
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openai-plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate . --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate ./plugin --strict --profile directory

  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npx --yes @google/gemini-cli@0.66.0 extensions validate .

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: ./scripts/install-mcp-publisher.sh
      - run: ./mcp-publisher validate server.json

  cline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cline/marketplace
          ref: 6969aa8505f2be81bb3627e47ab0037d234aeaf7
          path: vendor/cline-marketplace
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: |
          mkdir -p vendor/cline-marketplace/registry/mcps/simple-balance
          cp submissions/cline/entry.json submissions/cline/icon.png vendor/cline-marketplace/registry/mcps/simple-balance/
      - working-directory: vendor/cline-marketplace
        run: node scripts/generate.mjs --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docker/mcp-registry
          ref: c1ff308dd6ba401e0f8dddb7d10a78042b2f0ce0
          path: vendor/docker-mcp-registry
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vendor/docker-mcp-registry/go.mod
      # Docker's validator shells out to `npx prettier` to check the YAML.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: cp -R submissions/docker/servers/simple-balance vendor/docker-mcp-registry/servers/
      - working-directory: vendor/docker-mcp-registry
        run: |
          go run ./cmd/validate --name simple-balance
          go run ./cmd/catalog simple-balance
