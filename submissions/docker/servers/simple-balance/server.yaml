name: simple-balance
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - personal-finance
    - budgeting
    - budget-app
    - spending-tracker
    - remote
about:
  title: Simple Balance
  description: "Free budget app and spending tracker: ask about your money, and queue or record transactions"
  icon: https://smpl.money/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://app.smpl.money/mcp
oauth:
  - provider: simple-balance
    secret: simple-balance.personal_access_token
    env: SIMPLE_BALANCE_PERSONAL_ACCESS_TOKEN
